<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PROJECT ECHO: OVERDRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --acid-green: #D3FF00;
            --void-black: #080808;
            --panel-grey: #1a1a1a;
            --pure-white: #ffffff;
            --alert-red: #FF2E00;
            
            --slant: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
            --slant-btn: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--void-black);
            color: var(--pure-white);
            font-family: 'Oswald', sans-serif;
            height: 100dvh; 
            width: 100vw;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111),
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            position: fixed;
            inset: 0;
        }

        /* --- 动态文本特效 CSS --- */
        .shake {
            display: inline-block;
            animation: shake 0.5s infinite;
            color: var(--alert-red);
            font-weight: bold;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .highlight {
            color: var(--acid-green);
            font-weight: bold;
            text-decoration: underline;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
            color: var(--pure-white);
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }
        .glitch-text::before {
            color: #ff00c1;
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            color: #00fff9;
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        /* --- 故障特效 (屏幕级) --- */
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-flash {
            0% { filter: invert(0); }
            50% { filter: invert(1) contrast(2); }
            100% { filter: invert(0); }
        }

        .glitch-active body {
            animation: glitch-flash 0.2s cubic-bezier(0.1, 0.7, 1.0, 0.1) 2;
        }

        .glitch-active #game-ui {
            animation: glitch-anim-1 0.2s infinite linear;
            filter: drop-shadow(-2px 0 red) drop-shadow(2px 0 blue);
        }

        /* --- 主菜单 --- */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 8, 0.98);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1);
        }

        #main-menu.hidden { transform: translateY(-100%); }

        .game-logo {
            font-family: 'Teko', sans-serif;
            font-size: 5rem;
            line-height: 0.8;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--pure-white);
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px var(--acid-green);
            transform: skew(-10deg);
            text-align: center;
        }

        .start-btn {
            background: var(--acid-green);
            color: var(--void-black);
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            padding: 10px 60px;
            border: none;
            cursor: pointer;
            clip-path: var(--slant-btn);
            transition: all 0.2s;
            text-transform: uppercase;
            position: relative;
        }

        .start-btn:active { transform: scale(0.95); }

        /* --- 开场独白 (Intro Sequence) --- */
        #intro-sequence {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #intro-sequence.active {
            opacity: 1;
            pointer-events: auto;
        }

        .intro-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: var(--acid-green);
            max-width: 800px;
            line-height: 1.6;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        
        .skip-hint {
            font-family: 'Teko', sans-serif;
            color: #666;
            font-size: 1.2rem;
            animation: blink 1s infinite;
            cursor: pointer;
            border: 1px solid #333;
            padding: 5px 15px;
        }

        /* --- 游戏主界面 --- */
        #game-ui {
            width: 95%;
            height: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 80px 1fr;
            gap: 15px;
            position: relative;
            transition: filter 0.1s;
        }

        /* 顶部栏 */
        header {
            grid-column: 1 / 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-grey);
            padding: 0 30px;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 98% 100%, 0 100%);
            border-bottom: 4px solid var(--acid-green);
            min-height: 0;
        }

        .header-title {
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            color: var(--acid-green);
            text-transform: uppercase;
        }

        .nav-group { display: flex; gap: 15px; }

        .nav-btn {
            background: transparent;
            border: 2px solid #444;
            color: #fff;
            padding: 5px 20px;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transform: skew(-10deg);
            font-size: 1rem;
        }

        /* 左侧面板 */
        aside {
            background: var(--panel-grey);
            padding: 20px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 95%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-left: 4px solid var(--acid-green);
            overflow-y: auto;
        }

        .avatar-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            position: relative;
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            border: 2px solid #333;
            flex-shrink: 0;
        }

        .avatar-container img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
        }

        .info-group { flex: 1; }

        .stat-label {
            font-family: 'Teko', sans-serif;
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 2px;
            display: flex; justify-content: space-between;
        }

        .bar-track {
            height: 12px; background: #000;
            transform: skew(-20deg); border: 1px solid #444;
        }

        .bar-fill {
            height: 100%; background: var(--acid-green); width: 50%;
            transition: width 0.5s cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }
        #bar-sanity .bar-fill { background: var(--acid-green); }
        #bar-social .bar-fill { background: #00e5ff; }
        #bar-career .bar-fill { background: #ff0055; }

        /* 主内容区 */
        main {
            background: rgba(26, 26, 26, 0.9);
            display: flex;
            flex-direction: column;
            border-top: 2px solid #333;
            position: relative;
            clip-path: polygon(0 0, 98% 0, 100% 5%, 100% 100%, 0 100%);
            min-height: 0;
        }

        /* 日志区 */
        #log-stream {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .log-node {
            background: linear-gradient(90deg, rgba(0,0,0,0.6), transparent);
            border-left: 4px solid #444;
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
            flex-shrink: 0;
            color: #ddd;
        }

        .log-node.active {
            border-left-color: var(--acid-green);
            background: linear-gradient(90deg, rgba(211, 255, 0, 0.05), transparent);
            color: #fff;
        }

        .time-tag {
            font-family: 'Teko', sans-serif; color: var(--acid-green);
            font-size: 1.1rem; margin-bottom: 5px;
        }

        /* 底部控制区 */
        #control-deck {
            flex-shrink: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: rgba(0,0,0,0.8);
            border-top: 1px solid #333;
            z-index: 10;
        }

        .cmd-btn {
            background: transparent;
            border: 2px solid #444;
            color: #fff;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            position: relative;
            transition: all 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .cmd-btn:active {
            background: var(--acid-green);
            color: #000;
            border-color: var(--acid-green);
        }

        .cmd-title {
            font-family: 'Teko', sans-serif; font-size: 1.5rem;
            color: var(--acid-green); text-transform: uppercase;
        }
        .cmd-btn:active .cmd-title { color: #000; }

        .cmd-desc { font-size: 0.9rem; color: #aaa; margin-top: 5px; line-height: 1.2; }
        .cmd-btn:active .cmd-desc { color: #333; }

        /* --- 手机端适配 --- */
        @media (max-width: 768px) {
            .game-logo { font-size: 3.5rem; }
            .start-btn { font-size: 1.8rem; padding: 10px 40px; }
            
            #intro-sequence { padding: 20px; }
            .intro-text { font-size: 1.1rem; }

            #game-ui {
                width: 100%; height: 100%;
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            header {
                flex: 0 0 50px;
                clip-path: none;
                padding: 0 10px;
                border-bottom: 2px solid var(--acid-green);
            }
            .header-title { font-size: 1.4rem; }
            .nav-btn { padding: 2px 10px; font-size: 0.8rem; }

            aside { 
                flex: 0 0 auto;
                flex-direction: row; 
                padding: 10px; 
                clip-path: none; 
                border-left: none; 
                border-bottom: 1px solid #333;
                align-items: center;
                gap: 10px;
                overflow-x: auto;
            }
            .avatar-container { width: 50px; height: 50px; border: 1px solid #333; }
            .info-group {
                display: flex;
                gap: 15px;
                overflow-x: auto;
                padding-right: 10px;
            }
            .info-group > div { min-width: 100px; margin-bottom: 0 !important; }
            .stat-label { font-size: 0.9rem; }
            .bar-track { height: 6px; transform: skew(-10deg); }

            main {
                flex: 1;
                clip-path: none;
                min-height: 0;
            }

            #log-stream { padding: 15px; }
            .log-node { padding: 10px; font-size: 1rem; }

            #control-deck {
                flex: 0 0 auto;
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 10px;
                padding-bottom: 25px; /* iOS Safe Area */
                border-top: 1px solid var(--acid-green);
            }
            .cmd-btn { padding: 10px; }
            .cmd-title { font-size: 1.2rem; }
            .cmd-desc { font-size: 0.8rem; }
        }

        .typing::after {
            content: '_';
            animation: blink 0.5s infinite;
            color: var(--acid-green);
        }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <!-- 故障效果层 (CSS Class 触发) -->
    <div id="glitch-layer"></div>

    <!-- 主菜单 -->
    <div id="main-menu">
        <div class="game-logo">PROJECT<br>ECHO</div>
        <div style="font-size: 1rem; color: #888; margin-bottom: 30px; letter-spacing: 2px; text-align: center;">SURVEILLANCE & MANIPULATION<br>SYSTEM ONLINE</div>
        <button class="start-btn" onclick="startIntro()">INITIATE</button>
    </div>

    <!-- 开场独白层 -->
    <div id="intro-sequence">
        <div class="intro-text" id="intro-text-container"></div>
        <div class="skip-hint" onclick="finishIntro()">[ CLICK TO PROCEED ]</div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-ui">
        <header>
            <div class="header-title">ECHO://TERMINAL</div>
            <div class="nav-group">
                <button class="nav-btn" id="bgm-toggle" onclick="toggleBGM()">♪ ON</button>
                <button class="nav-btn" onclick="exitToMenu()">EXIT</button>
            </div>
        </header>

        <aside>
            <div class="avatar-container" onclick="document.getElementById('file-input').click()">
                <img id="avatar-img" src="https://images.unsplash.com/photo-1595152772835-219674b2a8a6?q=80&w=500&auto=format&fit=crop">
                <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="loadAvatar(this)">
            </div>
            
            <div class="info-group">
                <div style="font-family:'Teko'; color:#666; margin-bottom:5px;">TARGET: <span style="color:var(--acid-green)">SISKO-4402</span></div>
                <div style="margin-bottom: 15px;">
                    <div class="stat-label"><span>PSYCHE (SAN)</span> <span id="val-sanity">80%</span></div>
                    <div class="bar-track"><div id="bar-sanity" class="bar-fill"></div></div>
                </div>

                <div style="margin-bottom: 15px;">
                    <div class="stat-label"><span>SOCIAL (REP)</span> <span id="val-social">60%</span></div>
                    <div class="bar-track"><div id="bar-social" class="bar-fill"></div></div>
                </div>

                <div>
                    <div class="stat-label"><span>CAREER ($)</span> <span id="val-career">50%</span></div>
                    <div class="bar-track"><div id="bar-career" class="bar-fill"></div></div>
                </div>
            </div>
        </aside>

        <main>
            <div id="log-stream"></div>
            <div id="control-deck"></div>
        </main>
    </div>

    <script>
        // --- BGM 系统 ---
        const BGM_URL = "https://cdn.pixabay.com/download/audio/2022/03/24/audio_076e0774a3.mp3?filename=sci-fi-cyberpunk-trailer-110587.mp3";
        let bgm = new Audio(BGM_URL);
        bgm.loop = true;
        bgm.volume = 0.5;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 启动流程：菜单 -> 独白 -> 游戏
        function startIntro() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('intro-sequence').classList.add('active');
            
            // 解锁音频
            if(audioCtx.state === 'suspended') audioCtx.resume();
            bgm.play().then(() => {
                document.getElementById('bgm-toggle').textContent = "♪ ON";
            }).catch(e => console.log("Audio play blocked", e));
            playSound('startup');

            // 播放开场文字动画
            const introText = "欢迎，操作员。<br><br>你的权限已解锁。你的观察目标是市民 <span class='highlight'>西斯克 (SISKO)</span>，ID 4402。<br><br>他只是这座巨大数据巢穴中一个微不足道的节点：平庸、疲惫、且极其脆弱。但在这里，你不是观察者，你是<span class='highlight'>神</span>。<br><br>通过操控网络舆论的流向，你可以轻易地捧红他，或者... <span class='shake'>毁灭</span>他。<br><br>记住，对系统而言，他是数据。但对他而言，这是他仅有的一次人生。";
            typeWriter(document.getElementById('intro-text-container'), introText, 30);
        }

        function finishIntro() {
            document.getElementById('intro-sequence').classList.remove('active');
            if(logStream.innerHTML === "") {
                renderScene('start');
            }
        }

        function exitToMenu() {
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function toggleBGM() {
            const btn = document.getElementById('bgm-toggle');
            if (bgm.paused) {
                bgm.play();
                btn.textContent = "♪ ON";
            } else {
                bgm.pause();
                btn.textContent = "♪ OFF";
            }
        }

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'type') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600 + Math.random()*200, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'click') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'startup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'glitch') { // 故障音效
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(50, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- 触发故障特效 ---
        function triggerGlitch() {
            document.body.classList.add('glitch-active');
            playSound('glitch');
            setTimeout(() => {
                document.body.classList.remove('glitch-active');
            }, 600); // 持续 0.6秒
        }

        // --- 游戏剧本 (Vividness Protocol) ---
        let stats = { sanity: 80, social: 60, career: 50 };
        const storyNodes = {
            start: {
                time: "08:31:04",
                text: "地铁三号线，空气中弥漫着潮湿雨伞和廉价早点混合的酸味。西斯克拖着沉重的身体挤进了车厢角落。他昨晚为了赶项目进度，一直加班到凌晨四点。此刻，他几乎是昏迷般地跌坐在了爱心专座上，眼下的黑眼圈像淤青一样深重。<br><br>他完全没看到那个刚上车、扶着腰的老人。但他闭眼皱眉的样子，被对面举起的三个手机镜头完整记录了下来。<br><br>半小时后，一段名为《装睡的巨婴》的视频开始在同城流传。算法正在等待你的指令。",
                choices: [
                    { title: "冷处理", desc: "降权、限流，让视频沉下去。", impact: { sanity: 0, social: 0, career: 0 }, next: "act_suppress" },
                    { title: "煽动情绪", desc: "把标签改成 #冷漠一代，推给愤怒的中年用户。", impact: { sanity: -15, social: -20, career: 0, glitch: true }, next: "act_inflame" },
                    { title: "反转叙事", desc: "放出他的加班打卡记录，打造 #社畜的悲哀。", impact: { sanity: -5, social: 10, career: -15 }, next: "act_reframe" }
                ]
            },
            act_suppress: {
                time: "12:15:00",
                text: "算法介入很及时。视频播放量卡在了 203 次，没掀起任何波澜。<br>西斯克对此一无所知，他准时打卡，像往常一样在工位上开始了一天的劳作。但他不知道的是，部门主管刚刚在工作群里发了一条：“最近有些人精神面貌很差，影响团队氛围。”",
                choices: [{ title: "继续监测", desc: "保持静默观察。", impact: {}, next: "incident_night_store" }]
            },
            act_inflame: {
                time: "12:15:00",

                    { title: "全域广播", desc: "不仅放行，还将截图转发至全员邮件。", impact: { sanity: -30, social: -10, career: -100, glitch: true }, next: "res_fired" },
                    { title: "无视", desc: "这是人类社交的自然淘汰。", impact: { sanity: -10, social: -5, career: -30, glitch: true }, next: "res_leaked" }
                ]
            },
            res_saved: { time: "20:00:00", text: "红色的感叹号出现在同事 A 的屏幕上。他试了几次都没发出去，最后怕被发现，骂骂咧咧地删掉了图片。<br>西斯克并不知道，自己刚刚在悬崖边走了一遭。", choices: [{ title: "下个周期", desc: "加载后续事件。", impact: {}, next: "incident_street" }] },
            res_leaked: { time: "DAY +01", text: "第二天一早，西斯克就被移出了项目组。没有正式通报，但年度绩效奖金已归零。<br>他的工位被调整到了靠近厕所的监控盲区。同事们开始像躲避瘟疫一样避开他。", choices: [{ title: "下个周期", desc: "加载后续事件。", impact: {}, next: "incident_street" }] },
            res_fired: { time: "DAY +01", text: "炸锅了。那封邮件成了全公司的笑话。西斯克被保安“请”出了大楼。<br>没有赔偿，只有羞辱。他抱着纸箱站在CBD的十字路口，像个透明的幽灵。", choices: [{ title: "下个周期", desc: "加载后续事件。", impact: {}, next: "incident_street" }] },

            end_hero: { time: "ARCHIVE", text: "【结局：微光】<br>警方采纳了证据。西斯克被认定为见义勇为。虽然生活依然艰难，房租依然要涨，但那天晚上，他抱着那只幸存的猫，睡了个安稳觉。<br>你给予了他在这座冰冷城市里唯一的温暖。<br><br>观察结束。", choices: [{ title: "重置系统", desc: "清除缓存数据。", impact: {}, next: "start" }] },
            end_ruin: { time: "ARCHIVE", text: "【结局：坠落】<br>舆论一边倒地指责他是“暴力狂”。工作丢了，房东退租了。他在互联网上社会性死亡，在现实中也没了立足之地。<br>他消失在了那个寒冷的冬夜，成为了一串被遗忘的代码。<br><br>观察结束。", choices: [{ title: "重置系统", desc: "清除缓存数据。", impact: {}, next: "start" }] },

        // --- 逻辑引擎 ---
        const logStream = document.getElementById('log-stream');
        const controlDeck = document.getElementById('control-deck');

        function updateUI() {
            document.getElementById('bar-sanity').style.width = Math.max(0, Math.min(100, stats.sanity)) + '%';
            document.getElementById('bar-social').style.width = Math.max(0, Math.min(100, stats.social)) + '%';
            document.getElementById('bar-career').style.width = Math.max(0, Math.min(100, stats.career)) + '%';
            
            document.getElementById('val-sanity').innerText = stats.sanity + "%";
            document.getElementById('val-social').innerText = stats.social + "%";
            document.getElementById('val-career').innerText = stats.career + "%";
        }

        async function typeWriter(element, text, speed = 20) {
            element.classList.add('typing');
            let buffer = "";
            let inTag = false;
            for(const char of text) {
                if(char === "<") inTag = true;
                buffer += char;
                if(char === ">") inTag = false;
                if(!inTag) {
                    element.innerHTML = buffer;
                    logStream.scrollTop = logStream.scrollHeight;
                    if(Math.random() > 0.5 && speed < 50) playSound('type');
                    await new Promise(r => setTimeout(r, speed));
                }
            }
            element.classList.remove('typing');
            logStream.scrollTop = logStream.scrollHeight;
        }

        async function renderScene(sceneId) {
            const scene = storyNodes[sceneId];
            if (sceneId === 'start') {
                logStream.innerHTML = '';
                stats = { sanity: 80, social: 60, career: 50 };
                updateUI();
            }

            document.querySelectorAll('.log-node').forEach(n => n.classList.remove('active'));

            const node = document.createElement('div');
            node.className = 'log-node active';
            node.innerHTML = `<div class="time-tag">// ${scene.time}</div><div class="content"></div>`;
            logStream.appendChild(node);

            controlDeck.innerHTML = '';
            
            await typeWriter(node.querySelector('.content'), scene.text);

            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'cmd-btn';
                btn.innerHTML = `<div class="cmd-title">${choice.title}</div><div class="cmd-desc">${choice.desc}</div>`;
                btn.onclick = () => {
                    playSound('click');
                    
                    // 触发故障特效
                    if(choice.impact && choice.impact.glitch) {
                        triggerGlitch();
                    }

                    if (choice.impact) {
                        stats.sanity += choice.impact.sanity || 0;
                        stats.social += choice.impact.social || 0;
                        stats.career += choice.impact.career || 0;
                        updateUI();
                    }
                    renderScene(choice.next);
                };
                controlDeck.appendChild(btn);
            });
            logStream.scrollTop = logStream.scrollHeight;
        }

        function loadAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('avatar-img').src = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
