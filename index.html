<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：禁止用户缩放，确保 App 般的体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PROJECT ECHO: OVERDRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --acid-green: #D3FF00;
            --void-black: #080808;
            --panel-grey: #1a1a1a;
            --pure-white: #ffffff;
            --alert-red: #FF2E00;
            
            --slant: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
            --slant-btn: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--void-black);
            color: var(--pure-white);
            font-family: 'Oswald', sans-serif;
            /* 关键修复：使用 dvh 适应移动端动态地址栏 */
            height: 100dvh; 
            width: 100vw;
            margin: 0;
            overflow: hidden; /* 禁止 Body 滚动，只允许内部区域滚动 */
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111),
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            position: fixed; /* 锁死页面防止整体回弹 */
            inset: 0;
        }

        /* --- 主菜单 --- */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 8, 0.98); /* 加深背景防止透视干扰 */
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.7, 0, 0.3, 1);
        }

        #main-menu.hidden { transform: translateY(-100%); }

        .game-logo {
            font-family: 'Teko', sans-serif;
            font-size: 5rem;
            line-height: 0.8;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--pure-white);
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px var(--acid-green);
            transform: skew(-10deg);
            text-align: center;
        }

        .start-btn {
            background: var(--acid-green);
            color: var(--void-black);
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            padding: 10px 60px;
            border: none;
            cursor: pointer;
            clip-path: var(--slant-btn);
            transition: all 0.2s;
            text-transform: uppercase;
            position: relative;
        }

        .start-btn:active { transform: scale(0.95); }

        /* --- 游戏主界面 --- */
        #game-ui {
            width: 95%;
            height: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 80px 1fr;
            gap: 15px;
            position: relative;
        }

        /* 顶部栏 */
        header {
            grid-column: 1 / 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-grey);
            padding: 0 30px;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 98% 100%, 0 100%);
            border-bottom: 4px solid var(--acid-green);
            min-height: 0; /* 防止 Flex 子项溢出 */
        }

        .header-title {
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            color: var(--acid-green);
            text-transform: uppercase;
        }

        .nav-group { display: flex; gap: 15px; }

        .nav-btn {
            background: transparent;
            border: 2px solid #444;
            color: #fff;
            padding: 5px 20px;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transform: skew(-10deg);
            font-size: 1rem;
        }

        /* 左侧面板 */
        aside {
            background: var(--panel-grey);
            padding: 20px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 95%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-left: 4px solid var(--acid-green);
            overflow-y: auto; /* 允许侧边栏内容滚动 */
        }

        .avatar-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            position: relative;
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            border: 2px solid #333;
            flex-shrink: 0;
        }

        .avatar-container img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
        }

        .info-group { flex: 1; }

        .stat-label {
            font-family: 'Teko', sans-serif;
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 2px;
            display: flex; justify-content: space-between;
        }

        .bar-track {
            height: 12px; background: #000;
            transform: skew(-20deg); border: 1px solid #444;
        }

        .bar-fill {
            height: 100%; background: var(--acid-green); width: 50%;
            transition: width 0.5s cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }
        #bar-sanity .bar-fill { background: var(--acid-green); }
        #bar-social .bar-fill { background: #00e5ff; }
        #bar-career .bar-fill { background: #ff0055; }

        /* 主内容区 */
        main {
            background: rgba(26, 26, 26, 0.9);
            display: flex;
            flex-direction: column;
            border-top: 2px solid #333;
            position: relative;
            clip-path: polygon(0 0, 98% 0, 100% 5%, 100% 100%, 0 100%);
            min-height: 0; /* 关键：允许 Flex 子项滚动 */
        }

        /* 日志区 - 滚动核心 */
        #log-stream {
            flex: 1; /* 占据剩余空间 */
            overflow-y: auto; /* 允许内部滚动 */
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch; /* iOS 丝滑滚动 */
            scroll-behavior: smooth;
        }

        .log-node {
            background: linear-gradient(90deg, rgba(0,0,0,0.6), transparent);
            border-left: 4px solid #444;
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.5;
            flex-shrink: 0; /* 防止内容被压缩 */
        }

        .log-node.active {
            border-left-color: var(--acid-green);
            background: linear-gradient(90deg, rgba(211, 255, 0, 0.05), transparent);
        }

        .time-tag {
            font-family: 'Teko', sans-serif; color: var(--acid-green);
            font-size: 1.1rem; margin-bottom: 5px;
        }

        /* 底部控制区 - 固定在底部 */
        #control-deck {
            flex-shrink: 0; /* 防止被压缩 */
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: rgba(0,0,0,0.8);
            border-top: 1px solid #333;
            z-index: 10;
        }

        .cmd-btn {
            background: transparent;
            border: 2px solid #444;
            color: #fff;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            position: relative;
            transition: all 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .cmd-btn:active {
            background: var(--acid-green);
            color: #000;
            border-color: var(--acid-green);
        }

        .cmd-title {
            font-family: 'Teko', sans-serif; font-size: 1.5rem;
            color: var(--acid-green); text-transform: uppercase;
        }
        .cmd-btn:active .cmd-title { color: #000; }

        .cmd-desc { font-size: 0.9rem; color: #aaa; margin-top: 5px; }
        .cmd-btn:active .cmd-desc { color: #333; }

        /* --- 手机端完美适配 --- */
        @media (max-width: 768px) {
            .game-logo { font-size: 3.5rem; }
            .start-btn { font-size: 1.8rem; padding: 10px 40px; }

            /* 容器改为 Flex 列布局，更稳健 */
            #game-ui {
                width: 100%; height: 100%;
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            /* 头部紧凑化 */
            header {
                flex: 0 0 50px; /* 固定高度 */
                clip-path: none;
                padding: 0 10px;
                border-bottom: 2px solid var(--acid-green);
            }
            .header-title { font-size: 1.4rem; }
            .nav-btn { padding: 2px 10px; font-size: 0.8rem; }

            /* 侧边栏紧凑化 */
            aside { 
                flex: 0 0 auto; /* 高度由内容决定 */
                flex-direction: row; 
                padding: 10px; 
                clip-path: none; 
                border-left: none; 
                border-bottom: 1px solid #333;
                align-items: center;
                gap: 10px;
                overflow-x: auto; /* 允许横向滑动 */
            }
            .avatar-container { width: 50px; height: 50px; border: 1px solid #333; }
            .info-group {
                display: flex;
                gap: 15px;
                overflow-x: auto; /* 数据条也可以横向滑 */
                padding-right: 10px;
            }
            .info-group > div { min-width: 100px; margin-bottom: 0 !important; }
            .stat-label { font-size: 0.9rem; }
            .bar-track { height: 6px; transform: skew(-10deg); }

            /* 主内容区域撑满剩余空间 */
            main {
                flex: 1; /* 占据剩余所有高度 */
                clip-path: none;
                min-height: 0; /* 关键：允许内部滚动 */
            }

            #log-stream { padding: 15px; }
            .log-node { padding: 10px; font-size: 1rem; }

            /* 底部按钮改为单列堆叠 */
            #control-deck {
                flex: 0 0 auto;
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 10px;
                padding-bottom: 25px; /* 适配 iPhone 底部横条 */
                border-top: 1px solid var(--acid-green);
            }
            .cmd-btn { padding: 10px; }
            .cmd-title { font-size: 1.2rem; }
            .cmd-desc { font-size: 0.8rem; }
        }

        /* 打字机光标 */
        .typing::after {
            content: '_';
            animation: blink 0.5s infinite;
            color: var(--acid-green);
        }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <!-- 主菜单 -->
    <div id="main-menu">
        <div class="game-logo">PROJECT<br>ECHO</div>
        <div style="font-size: 1rem; color: #888; margin-bottom: 30px; letter-spacing: 2px; text-align: center;">ZERO DEGREE OBSERVATION<br>MOBILE OPTIMIZED</div>
        <button class="start-btn" onclick="startGame()">START MISSION</button>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-ui">
        <header>
            <div class="header-title">ECHO://TERMINAL</div>
            <div class="nav-group">
                <button class="nav-btn" id="bgm-toggle" onclick="toggleBGM()">♪ ON</button>
                <button class="nav-btn" onclick="exitToMenu()">EXIT</button>
            </div>
        </header>

        <aside>
            <div class="avatar-container" onclick="document.getElementById('file-input').click()">
                <img id="avatar-img" src="https://images.unsplash.com/photo-1595152772835-219674b2a8a6?q=80&w=500&auto=format&fit=crop">
                <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="loadAvatar(this)">
            </div>
            
            <div class="info-group">
                <div style="margin-bottom: 15px;">
                    <div class="stat-label"><span>PSYCHE</span> <span id="val-sanity">80%</span></div>
                    <div class="bar-track"><div id="bar-sanity" class="bar-fill"></div></div>
                </div>

                <div style="margin-bottom: 15px;">
                    <div class="stat-label"><span>SOCIAL</span> <span id="val-social">60%</span></div>
                    <div class="bar-track"><div id="bar-social" class="bar-fill"></div></div>
                </div>

                <div>
                    <div class="stat-label"><span>CAREER</span> <span id="val-career">50%</span></div>
                    <div class="bar-track"><div id="bar-career" class="bar-fill"></div></div>
                </div>
            </div>
        </aside>

        <main>
            <div id="log-stream"></div>
            <div id="control-deck"></div>
        </main>
    </div>

    <script>
        // --- 音乐与音效系统 ---
        // 替换为你自己的音乐链接
        const BGM_URL = "https://cdn.pixabay.com/download/audio/2022/03/24/audio_076e0774a3.mp3?filename=sci-fi-cyberpunk-trailer-110587.mp3";
        let bgm = new Audio(BGM_URL);
        bgm.loop = true;
        bgm.volume = 0.5;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function startGame() {
            document.getElementById('main-menu').classList.add('hidden');
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            bgm.play().then(() => {
                document.getElementById('bgm-toggle').textContent = "♪ ON";
            }).catch(e => console.log("Audio play blocked", e));

            playSound('startup');
            
            if(logStream.innerHTML === "") {
                renderScene('start');
            }
        }

        function exitToMenu() {
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function toggleBGM() {
            const btn = document.getElementById('bgm-toggle');
            if (bgm.paused) {
                bgm.play();
                btn.textContent = "♪ ON";
            } else {
                bgm.pause();
                btn.textContent = "♪ OFF";
            }
        }

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'type') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600 + Math.random()*200, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'click') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'startup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- 游戏逻辑 ---
        let stats = { sanity: 80, social: 60, career: 50 };
        const storyNodes = {
            start: {
                time: "08:31:04",
                text: "样本进入地铁 3 号线。睡眠不足引发浅层休克。老年乘客停留 45s 未获让座。周边设备记录中。视频上传至流媒体，标签：#巨婴 #素质。<br><br>系统介入建议：",
                choices: [
                    { title: "SUPPRESS", desc: "降权/限流/封锁关键词", impact: { sanity: 0, social: 0, career: 0 }, next: "act_suppress" },
                    { title: "INFLAME", desc: "标签重定向：#冷漠 / 增加推送", impact: { sanity: -15, social: -20, career: 0 }, next: "act_inflame" },
                    { title: "REFRAME", desc: "披露考勤数据 / 标签：#过劳", impact: { sanity: -5, social: 10, career: -15 }, next: "act_reframe" }
                ]
            },
            act_suppress: {
                time: "12:15:00",
                text: "干预生效。播放量锁定 203。样本未察觉异常。14:00 部门主管发布业绩预警通告。",
                choices: [{ title: "MONITOR", desc: "继续当前观测频率", impact: {}, next: "incident_work" }]
            },
            act_inflame: {
                time: "12:15:00",
                text: "播放量突破 50 万。样本收到 322 条攻击性信息。心率均值 95bpm。办公区视线压力指数上升。",
                choices: [{ title: "LOG DATA", desc: "归档压力数值", impact: {}, next: "incident_work" }]
            },
            act_reframe: {
                time: "12:15:00",
                text: "舆论转移。样本获 1.2 万点赞。HR 启动风险评估，判定存在“潜在负面影响”。",
                choices: [{ title: "UPDATE", desc: "更新职级风险指数", impact: {}, next: "incident_work" }]
            },
            incident_work: {
                time: "11-15 19:42",
                text: "样本在私密群组发送文本：“管理层逻辑漏洞严重。”<br>监测到群成员 A 截屏，目标发送对象：高层。<br>窗口期剩余 10 秒。",
                choices: [
                    { title: "BLOCK", desc: "模拟丢包 / 销毁数据", impact: { sanity: 5, social: 0, career: 0 }, next: "res_saved" },
                    { title: "BROADCAST", desc: "重定向至全员邮件", impact: { sanity: -30, social: -10, career: -100 }, next: "res_fired" },
                    { title: "IGNORE", desc: "允许数据自然流动", impact: { sanity: -10, social: -5, career: -30 }, next: "res_leaked" }
                ]
            },
            res_saved: { time: "20:00:00", text: "阻断成功。截屏未发出。样本摄入加热食品后返所。", choices: [{ title: "NEXT CYCLE", desc: "加载后续事件", impact: {}, next: "incident_street" }] },
            res_leaked: { time: "DAY +01", text: "接受人事谈话。绩效奖金归零。工位调整至盲区。", choices: [{ title: "NEXT CYCLE", desc: "加载后续事件", impact: {}, next: "incident_street" }] },
            res_fired: { time: "DAY +01", text: "劳动合同解除。样本离开建筑。无人员道别。", choices: [{ title: "NEXT CYCLE", desc: "加载后续事件", impact: {}, next: "incident_street" }] },
            incident_street: {
                time: "11-20 23:11",
                text: "遭遇动物虐待事件。样本与醉酒个体冲突。对方倒地，软组织挫伤。<br>定性分析：",
                choices: [
                    { title: "SYNTHESIZE", desc: "生成热成像证据 / 判定正当防卫", impact: { sanity: 10, social: 20, career: 0 }, next: "end_hero" },
                    { title: "EDIT", desc: "保留推搡画面 / 定性互殴", impact: { sanity: -50, social: -50, career: -50 }, next: "end_ruin" },
                    { title: "IGNORE", desc: "不进行干预", impact: { sanity: -5, social: -5, career: -5 }, next: "end_mediocre" }
                ]
            },
            end_hero: { time: "ARCHIVE", text: "获得短暂关注。精神稳定。状态：存续。<br>观察结束。", choices: [{ title: "RESET", desc: "清除缓存数据", impact: {}, next: "start" }] },
            end_ruin: { time: "ARCHIVE", text: "社会链接断裂。经济切断。样本在数据流中消失。<br>观察结束。", choices: [{ title: "RESET", desc: "清除缓存数据", impact: {}, next: "start" }] },
            end_mediocre: { time: "ARCHIVE", text: "支付行政罚款。轨迹回归基准线。<br>观察结束。", choices: [{ title: "RESET", desc: "清除缓存数据", impact: {}, next: "start" }] }
        };

        const logStream = document.getElementById('log-stream');
        const controlDeck = document.getElementById('control-deck');

        function updateUI() {
            document.getElementById('bar-sanity').style.width = Math.max(0, Math.min(100, stats.sanity)) + '%';
            document.getElementById('bar-social').style.width = Math.max(0, Math.min(100, stats.social)) + '%';
            document.getElementById('bar-career').style.width = Math.max(0, Math.min(100, stats.career)) + '%';
            
            document.getElementById('val-sanity').innerText = stats.sanity + "%";
            document.getElementById('val-social').innerText = stats.social + "%";
            document.getElementById('val-career').innerText = stats.career + "%";
        }

        async function typeWriter(element, text) {
            element.classList.add('typing');
            let buffer = "";
            let inTag = false;
            for(const char of text) {
                if(char === "<") inTag = true;
                buffer += char;
                if(char === ">") inTag = false;
                if(!inTag) {
                    element.innerHTML = buffer;
                    // 确保一直滚动到底部
                    logStream.scrollTop = logStream.scrollHeight;
                    if(Math.random() > 0.5) playSound('type');
                    await new Promise(r => setTimeout(r, 20));
                }
            }
            element.classList.remove('typing');
            // 最后再强制滚动一次
            logStream.scrollTop = logStream.scrollHeight;
        }

        async function renderScene(sceneId) {
            const scene = storyNodes[sceneId];
            if (sceneId === 'start') {
                logStream.innerHTML = '';
                stats = { sanity: 80, social: 60, career: 50 };
                updateUI();
            }

            document.querySelectorAll('.log-node').forEach(n => n.classList.remove('active'));

            const node = document.createElement('div');
            node.className = 'log-node active';
            node.innerHTML = `<div class="time-tag">// ${scene.time}</div><div class="content"></div>`;
            logStream.appendChild(node);

            controlDeck.innerHTML = '';
            
            await typeWriter(node.querySelector('.content'), scene.text);

            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'cmd-btn';
                btn.innerHTML = `<div class="cmd-title">${choice.title}</div><div class="cmd-desc">${choice.desc}</div>`;
                btn.onclick = () => {
                    playSound('click');
                    if (choice.impact) {
                        stats.sanity += choice.impact.sanity || 0;
                        stats.social += choice.impact.social || 0;
                        stats.career += choice.impact.career || 0;
                        updateUI();
                    }
                    renderScene(choice.next);
                };
                controlDeck.appendChild(btn);
            });
            // 生成按钮后也确保可见
            logStream.scrollTop = logStream.scrollHeight;
        }

        function loadAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('avatar-img').src = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
