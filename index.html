<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>回响计划：样本观察</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 像素字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Zpix&family=VT323&display=swap" rel="stylesheet">
    <!-- 引入 Zpix 中文像素字体，如果加载失败会回退到系统字体，但保持像素化渲染 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        :root {
            /* 零度配色方案：冷、净、硬 */
            --bg-deep: #0a0b10;     /* 深空黑 */
            --bg-panel: #14161f;    /* 面板灰 */
            --bg-slot: #1c202b;     /* 插槽深灰 */
            
            --text-main: #e2e8f0;   /* 冰白 */
            --text-dim: #64748b;    /* 暗灰 */
            
            --accent-cyan: #00f0ff; /* 终端青 (高亮) */
            --accent-red: #ff2a6d;  /* 警告红 */
            --accent-yellow: #ffcc00; /* 注意黄 */
            
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            /* 保持像素风的锐利 */
            image-rendering: pixelated; 
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Sans SC', 'VT323', sans-serif; /* 优先中文无衬线，兼容像素感 */
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* 极简网格背景 */
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 容器：就像一个悬浮的平板 */
        #terminal-container {
            width: 95%;
            height: 90%;
            max-width: 1000px;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: 50px 1fr;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* 顶部状态栏 */
        header {
            grid-column: 1 / 3;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(0,0,0,0.2);
        }

        .header-title {
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: bold;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* 左侧面板：档案 */
        aside {
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(0,0,0,0.1);
        }

        .avatar-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: var(--bg-slot);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .avatar-box:hover {
            border-color: var(--accent-cyan);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1); /* 冷漠的黑白照 */
            opacity: 0.8;
        }
        
        .avatar-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.7rem;
            text-align: center;
            padding: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .avatar-box:hover .avatar-overlay { opacity: 1; }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        /* 数据条 (Clean style) */
        .stat-bar-bg {
            height: 6px;
            background: var(--bg-slot);
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .stat-bar-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 50%;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 主内容区 */
        main {
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-panel);
            position: relative;
        }

        /* 日志流 */
        #log-stream {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 隐藏滚动条但保留功能 */
        #log-stream::-webkit-scrollbar { width: 4px; }
        #log-stream::-webkit-scrollbar-thumb { background: var(--border-color); }

        .log-node {
            border-left: 2px solid var(--border-color);
            padding-left: 20px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            position: relative;
        }
        
        .log-node::before {
            content: '';
            position: absolute;
            left: -5px; top: 0;
            width: 8px; height: 8px;
            background: var(--bg-panel);
            border: 2px solid var(--text-dim);
            border-radius: 50%;
        }

        .log-node.active {
            border-left-color: var(--accent-cyan);
        }
        .log-node.active::before {
            border-color: var(--accent-cyan);
            background: var(--accent-cyan);
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .time-stamp {
            font-family: 'VT323', monospace;
            color: var(--accent-cyan);
            font-size: 0.9rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .log-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #d1d5db;
        }

        /* 底部控制台 */
        #control-deck {
            border-top: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
            padding: 20px 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 严格的三列布局 */
            gap: 20px;
            min-height: 140px;
        }

        .cmd-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cmd-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
        }

        .cmd-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 2px;
            background: var(--accent-cyan);
            transition: width 0.2s;
        }
        .cmd-btn:hover::after { width: 100%; }

        .cmd-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .cmd-desc {
            font-size: 0.8rem;
            opacity: 0.7;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            #terminal-container {
                width: 100%;
                height: 100%;
                border: none;
                grid-template-columns: 1fr;
                grid-template-rows: 50px auto 1fr auto;
            }

            aside {
                flex-direction: row;
                padding: 15px;
                gap: 15px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                align-items: center;
            }

            .avatar-box {
                width: 60px;
                height: 60px;
                margin-bottom: 0;
            }

            .info-group {
                display: flex;
                gap: 15px;
                flex: 1;
                justify-content: space-around;
            }
            
            .stat-wrapper {
                flex: 1;
            }
            
            .stat-bar-bg { margin-bottom: 0; }
            .info-label { margin-bottom: 2px; }
            .info-value { display: none; } /* 手机端隐藏具体数值，只看条 */

            #control-deck {
                grid-template-columns: 1fr;
                padding: 15px;
                gap: 10px;
            }
            
            .cmd-btn {
                padding: 12px;
                min-height: auto;
            }
        }
    </style>
</head>
<body>

    <div id="terminal-container">
        <!-- 顶栏 -->
        <header>
            <div class="header-title">Project Echo :: 样本观察记录</div>
            <div style="font-size: 0.8rem; color: var(--text-dim);">
                <span class="status-dot"></span> 实时数据流
            </div>
        </header>

        <!-- 侧边栏：样本信息 -->
        <aside>
            <div class="avatar-box" onclick="document.getElementById('file-input').click()">
                <img id="avatar-img" src="https://images.unsplash.com/photo-1595152772835-219674b2a8a6?q=80&w=500&auto=format&fit=crop" alt="样本头像">
                <div class="avatar-overlay">更换样本</div>
                <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="loadAvatar(this)">
            </div>
            
            <div class="info-group">
                <div class="stat-wrapper">
                    <div class="info-label">样本编号</div>
                    <div class="info-value">LIAO-Z-01</div>
                    
                    <div class="info-label">心理阈值</div>
                    <div class="stat-bar-bg">
                        <div id="bar-sanity" class="stat-bar-fill" style="width: 80%;"></div>
                    </div>
                </div>

                <div class="stat-wrapper">
                    <div class="info-label">社会链接</div>
                    <div class="stat-bar-bg">
                        <div id="bar-social" class="stat-bar-fill" style="width: 60%; background-color: var(--accent-yellow);"></div>
                    </div>
                </div>

                <div class="stat-wrapper">
                    <div class="info-label">资源/职级</div>
                    <div class="stat-bar-bg">
                        <div id="bar-career" class="stat-bar-fill" style="width: 50%; background-color: #fff;"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main>
            <div id="log-stream">
                <!-- 动态日志生成区 -->
            </div>

            <div id="control-deck">
                <!-- 动态按钮区 -->
            </div>
        </main>
    </div>

    <script>
        // --- 核心数据 ---
        let stats = { 
            sanity: 80,   // 心理
            social: 60,   // 社会
            career: 50    // 职业
        };

        // --- 零度写作剧本 (Zero Degree Script) ---
        const storyNodes = {
            start: {
                time: "08:31:04",
                text: "样本进入地铁 3 号线车厢。由于昨夜 4 小时 12 分钟的睡眠不足，样本在座位上进入浅层睡眠状态。一名老年乘客在其面前停留 45 秒。随后，周围乘客启动摄像设备。30 分钟后，相关视频上传至流媒体平台，标签包含“素质”、“教育缺失”。<br><br>系统建议操作：",
                choices: [
                    { title: "权重降级", desc: "降低视频流推广权重。限制关键词索引。", impact: { sanity: 0, social: 0, career: 0 }, next: "act_suppress" },
                    { title: "标签重定向", desc: "关联标签：#冷漠。增加推送频次。", impact: { sanity: -15, social: -20, career: 0 }, next: "act_inflame" },
                    { title: "数据披露", desc: "公开样本考勤记录。关联标签：#过劳。", impact: { sanity: -5, social: 10, career: -15 }, next: "act_reframe" }
                ]
            },
            act_suppress: {
                time: "12:15:00",
                text: "干预生效。视频播放量停留在 203 次。样本准时打卡。未察觉异常。14:00，部门主管在工作群发布全员通告，指出团队整体业绩未达标。",
                choices: [{ title: "继续监测", desc: "保持当前观测频率。", impact: {}, next: "incident_work" }]
            },
            act_inflame: {
                time: "12:15:00",
                text: "视频播放量突破 50 万。样本私人通讯终端收到 322 条陌生信息。样本心率均值上升至 95bpm。办公区域内，三名同事视线在样本身上停留超过 5 秒。",
                choices: [{ title: "记录数据", desc: "归档当前压力数值。", impact: {}, next: "incident_work" }]
            },
            act_reframe: {
                time: "12:15:00",
                text: "舆论焦点转移。样本获得 1.2 万次点赞。HR 部门启动风险评估程序，判定样本存在“潜在负面影响”。",
                choices: [{ title: "记录数据", desc: "更新职级风险指数。", impact: {}, next: "incident_work" }]
            },
            incident_work: {
                time: "11-15 19:42",
                text: "样本在 4 人私密群组发送文本：“管理层决策逻辑存在严重漏洞。”<br>监测到群成员 A 进行截屏操作，目标发送对象为公司高层。<br>窗口期剩余 10 秒。",
                choices: [
                    { title: "数据阻断", desc: "模拟网络丢包，销毁传输数据。", impact: { sanity: 5, social: 0, career: 0 }, next: "res_saved" },
                    { title: "全域广播", desc: "将截图重定向至全员邮件列表。", impact: { sanity: -30, social: -10, career: -100 }, next: "res_fired" },
                    { title: "无操作", desc: "允许数据自然流动。", impact: { sanity: -10, social: -5, career: -30 }, next: "res_leaked" }
                ]
            },
            res_saved: { time: "20:00:00", text: "数据传输失败。截屏文件未发出。样本在便利店购买加热食品，随后返回住所。", choices: [{ title: "下个周期", desc: "加载后续事件。", impact: {}, next: "incident_street" }] },
            res_leaked: { time: "DAY +01", text: "样本接受人事谈话。年度绩效奖金归零。工位调整至监控盲区。", choices: [{ title: "下个周期", desc: "加载后续事件。", impact: {}, next: "incident_street" }] },
            res_fired: { time: "DAY +01", text: "样本劳动合同即时解除。样本携带私人物品离开建筑。无人员进行道别。", choices: [{ title: "下个周期", desc: "加载后续事件。", impact: {}, next: "incident_street" }] },
            incident_street: {
                time: "11-20 23:11",
                text: "样本在非监控区域遭遇动物虐待事件。样本与两名醉酒个体发生肢体冲突。对方倒地，体表出现软组织挫伤。<br>定性分析：",
                choices: [
                    { title: "证据合成", desc: "生成热成像轨迹，判定正当防卫。", impact: { sanity: 10, social: 20, career: 0 }, next: "end_hero" },
                    { title: "片面剪辑", desc: "仅保留推搡画面。定性：互殴。", impact: { sanity: -50, social: -50, career: -50 }, next: "end_ruin" },
                    { title: "忽略", desc: "不进行数据干预。", impact: { sanity: -5, social: -5, career: -5 }, next: "end_mediocre" }
                ]
            },
            end_hero: { time: "ARCHIVE", text: "样本获得短暂社会关注。精神状态稳定。生存状态：存续。<br>观察结束。", choices: [{ title: "重置", desc: "清除缓存数据。", impact: {}, next: "start" }] },
            end_ruin: { time: "ARCHIVE", text: "样本社会链接断裂。经济来源切断。样本在城市数据流中消失。<br>观察结束。", choices: [{ title: "重置", desc: "清除缓存数据。", impact: {}, next: "start" }] },
            end_mediocre: { time: "ARCHIVE", text: "样本支付行政罚款。生活轨迹回归基准线。<br>观察结束。", choices: [{ title: "重置", desc: "清除缓存数据。", impact: {}, next: "start" }] }
        };

        // --- 逻辑引擎 ---
        const logStream = document.getElementById('log-stream');
        const controlDeck = document.getElementById('control-deck');

        function updateUI() {
            document.getElementById('bar-sanity').style.width = Math.max(0, Math.min(100, stats.sanity)) + '%';
            document.getElementById('bar-social').style.width = Math.max(0, Math.min(100, stats.social)) + '%';
            document.getElementById('bar-career').style.width = Math.max(0, Math.min(100, stats.career)) + '%';
            
            // 动态颜色变化
            const bars = [
                {id: 'bar-sanity', val: stats.sanity},
                {id: 'bar-social', val: stats.social},
                {id: 'bar-career', val: stats.career}
            ];
            
            bars.forEach(item => {
                const el = document.getElementById(item.id);
                if (item.val < 30) el.style.backgroundColor = 'var(--accent-red)';
                else if (item.id === 'bar-social') el.style.backgroundColor = 'var(--accent-yellow)';
                else if (item.id === 'bar-career') el.style.backgroundColor = '#fff';
                else el.style.backgroundColor = 'var(--accent-cyan)';
            });
        }

        function createLogNode(scene) {
            // 移除上一个节点的 active 状态
            const prevNodes = document.querySelectorAll('.log-node');
            prevNodes.forEach(n => n.classList.remove('active'));

            const node = document.createElement('div');
            node.className = 'log-node active';
            node.innerHTML = `
                <div class="time-stamp">[TIME: ${scene.time}]</div>
                <div class="log-content">${scene.text}</div>
            `;
            logStream.appendChild(node);
            
            // 自动滚动到底部
            setTimeout(() => {
                logStream.scrollTop = logStream.scrollHeight;
            }, 100);
        }

        function renderScene(sceneId) {
            const scene = storyNodes[sceneId];
            
            if (sceneId === 'start') {
                logStream.innerHTML = '';
                stats = { sanity: 80, social: 60, career: 50 };
                updateUI();
            }

            createLogNode(scene);

            controlDeck.innerHTML = '';
            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'cmd-btn';
                btn.innerHTML = `
                    <div class="cmd-title">${choice.title}</div>
                    <div class="cmd-desc">${choice.desc}</div>
                `;
                btn.onclick = () => {
                    if (choice.impact) {
                        stats.sanity += choice.impact.sanity || 0;
                        stats.social += choice.impact.social || 0;
                        stats.career += choice.impact.career || 0;
                        updateUI();
                    }
                    renderScene(choice.next);
                };
                controlDeck.appendChild(btn);
            });
        }

        // 头像更换逻辑
        function loadAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('avatar-img').src = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 启动
        renderScene('start');

    </script>
</body>
</html>
